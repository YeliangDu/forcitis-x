name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: replica/package-lock.json

      - name: install
        run: npm ci
        working-directory: replica

      - name: build + lint + test
        run: npm run check
        working-directory: replica

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: python syntax
        run: python3 -m compileall -q scripts

      - name: standards gate
        run: python3 scripts/check-standards.py

      - name: acceptance ledger self-test
        run: python3 scripts/check-acceptance.py --self-test
